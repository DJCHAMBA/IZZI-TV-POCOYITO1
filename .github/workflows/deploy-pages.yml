name: Publicar sitio web Pocoyito TV

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'azteca7-test.html'
      - 'canal5-test.html'
      - 'reproductor-externo.html'
      - 'laboratorio-iptv.html'
      - 'manifest.webmanifest'
      - 'service-worker.js'
      - 'icons/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Preparar sitio web
        run: |
          mkdir -p _site/icons
          cp index.html azteca7-test.html canal5-test.html reproductor-externo.html laboratorio-iptv.html manifest.webmanifest service-worker.js _site/
          cp icons/icon.svg _site/icons/
      - name: Subir sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar sitio web
        id: deployment
        uses: actions/deploy-pages@v4

# Trigger initial publication now that the repository is public.

